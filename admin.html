
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin lớp 8/14</title>
<style>
body{font-family:Arial;background:#fff5f5;margin:0;padding:20px;color:#222}
main{max-width:600px;margin:20px auto;background:white;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0001}
h1{color:#b91c1c;text-align:center}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border-radius:8px}
input{border:1px solid #ddd}
button{background:#b91c1c;color:white;border:0;font-weight:bold}
#preview{width:100%;margin-top:12px;border-radius:10px;display:none}
.note{font-size:13px;color:#666}
</style>
</head>
<body>
<main>
<h1>ADMIN LỚP 8/14</h1>
<h3>Đăng thời khóa biểu</h3>
<label>Tiêu đề bài đăng</label>
<input id="title" placeholder="VD: Thời khóa biểu tuần 1">
<label>Chọn ảnh từ điện thoại</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" alt="Xem trước thời khóa biểu">
<button onclick="previewImage()">XEM TRƯỚC ẢNH</button>
<p class="note">Đây mới là giao diện chọn ảnh. Cần kết nối đăng nhập và lưu trữ trực tuyến để đăng bài cho cả lớp xem.</p>
</main>
<script>
function previewImage(){
 const f=document.getElementById('photo').files[0];
 if(!f){alert('Bro hãy chọn ảnh trước nhé!');return}
 const img=document.getElementById('preview');
 img.src=URL.createObjectURL(f);
 img.style.display='block';
}
</script>
</body>
</html>
